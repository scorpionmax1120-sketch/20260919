<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入 MiniProfile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="box">
    <h1>登入 MiniProfile</h1>
    <form id="f">
      <input name="username" placeholder="帳號" autocomplete="username">
      <input name="password" type="password" placeholder="密碼" autocomplete="current-password">
      <button>登入</button>
    </form>
    <p id="msg" class="msg"></p>
    <p class="hint">測試帳號：jase / 1234</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
